[package]
name = "raylib-ffi"
version = "5.5.0"
edition = "2021"
description = "Automatic raw Rust bindings to raylib"
exclude = [
    "third_party/raylib/examples/*",
    "third_party/raylib/logo/*",
    "third_party/raylib/projects/*"
]
build = "build/main.rs"

[dependencies]
num-traits = "^0.2.19"
num-derive = "^0.4.2"

[build-dependencies]
bindgen = "0.70.1"
cmake = "0.1.51"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

[features]
default = ["macros"]
macros = []
dylib = []
